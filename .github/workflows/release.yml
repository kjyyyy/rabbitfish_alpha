name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}

      # A tag must not be able to ship something that does not pass its own gates.
      - run: pip install -e ".[dev,web]"
      - run: ruff check src tests
      - run: python -m alembic upgrade head && python -m alembic check
      - run: pytest -q

      - name: the tag must match the package version
        run: |
          v=$(python -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          [ "refs/tags/v$v" = "${{ github.ref }}" ] || {
            echo "tag ${{ github.ref }} does not match pyproject version $v"; exit 1; }

      - name: build the wheel and sdist
        run: pip install build && python -m build

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            Research software. It does not place orders and nothing here is financial advice.
            See CHANGELOG.md for what changed and what it cost.
